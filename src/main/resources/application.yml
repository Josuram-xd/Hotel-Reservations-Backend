server:
  port: ${PORT:8080}

spring:
  application:
    name: hotel-reservations

hotel:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  pricing:
    high-season-multiplier: 1.5
    base-prices:
      SINGLE: 60.00
      DOUBLE: 90.00
      SUITE: 180.00
    high-season:
      - start: 06-01
        end: 08-31
      - start: 12-15
        end: 01-06
  auth:
    token-ttl: ${AUTH_TOKEN_TTL:8h}
  extras:
    spa: 50.00
    breakfast-per-day: 15.00
    transfer: 30.00

management:
  endpoints:
    web:
      exposure:
        include: health
